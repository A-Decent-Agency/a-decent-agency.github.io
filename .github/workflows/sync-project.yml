name: Sync marathon project
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: project-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check project read secret
        id: token
        env:
          PROJECT_READ_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
        run: |
          if [ -z "$PROJECT_READ_TOKEN" ]; then
            echo '::notice::PROJECT_READ_TOKEN is missing; skipping project sync.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Export privacy-filtered snapshot
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
        run: node scripts/export-project.mjs
      - name: Observe approved public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-progress.mjs
      - name: Commit only changed project data
        run: |
          node --test
          if [ -n "$(git status --porcelain -- data/project.json data/progress.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/project.json data/progress.json
            git commit -m "Sync marathon snapshot" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
